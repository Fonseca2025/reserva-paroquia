{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header text-white" style="background-color: var(--verde-paroquia);">
                <h4 class="mb-0">Criar Nova Conta</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nome Completo</label>
                        <input type="text" name="username" class="form-control" placeholder="Seu nome ou nome da Pastoral" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input type="email" name="email" class="form-control" placeholder="exemplo@gmail.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" name="password" class="form-control" placeholder="Crie uma senha" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Finalizar Cadastro</button>
                </form>
                <div class="text-center mt-3">
                    <p>Já tem uma conta? <a href="/login">Faça login aqui</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
