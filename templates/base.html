<!DOCTYPE html>
<html>
<head>
    <title>SJT Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --verde: #1b4d3e; --vinho: #7a1b1b; }
        .navbar { background: var(--verde) !important; border-bottom: 4px solid var(--vinho); }
        .btn-primary { background: var(--vinho) !important; border: none; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">São Judas Tadeu - MOC</a>
            <div>
                {% if current_user.is_authenticated %}
                    <a href="/logout" class="btn btn-sm btn-outline-light">Sair</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}{% for m in messages %}
                <div class="alert alert-info">{{ m|safe }}</div>
            {% endfor %}{% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
